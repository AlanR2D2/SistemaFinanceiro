[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    -p no:cacheprovider
markers =
    smoke: testes rápidos de fumaça (rode antes dos outros)
    crud: testes de CRUD de campos/opções
    isolation: testes de isolamento entre tenants — críticos
    slow: testes mais lentos (drag-drop, fluxos longos)
