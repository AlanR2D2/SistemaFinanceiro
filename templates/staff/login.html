<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Staff — Sistema Financeiro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/feather-icons"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at 20% 20%, #1a1f3a, #0b1020 60%);
      color: #e5e7eb;
    }
    .card{
      background: #11172e;
      border: 1px solid #1f2a4a;
      border-radius: 18px;
      box-shadow: 0 25px 60px rgba(0,0,0,.45);
    }
    .badge{
      display:inline-flex; align-items:center; gap:6px;
      background: #f59e0b; color:#000;
      padding: 4px 12px; border-radius: 999px;
      font-size: 11px; font-weight:900; letter-spacing:.08em;
    }
    .inp{
      width:100%; height: 46px; padding: 0 14px 0 42px; border-radius: 12px;
      background: #0f1530; color: #fff; border: 1px solid #1f2a4a;
      outline: none;
    }
    .inp:focus{ border-color: #f59e0b; box-shadow: 0 0 0 3px rgba(245,158,11,.18); }
    .btn{
      width:100%; height: 46px; border-radius: 12px;
      background: #f59e0b; color: #000; font-weight: 900; font-size: 14px;
      border: 1px solid #d97706; cursor:pointer;
    }
    .btn:hover{ background: #d97706; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="card w-full max-w-md p-8">
    <div class="text-center mb-6">
      <div class="mb-3"><span class="badge"><i data-feather="shield" style="width:14px;height:14px;"></i> STAFF</span></div>
      <h1 class="text-2xl font-extrabold text-white">Painel Staff</h1>
      <p class="text-sm text-slate-400 mt-1">Acesso restrito — gestão de tenants</p>
    </div>

    <form method="POST" action="{{ url_for('staff_login_post') }}" class="space-y-4">
      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
          <i data-feather="mail" class="h-5 w-5 text-amber-500"></i>
        </div>
        <input class="inp" type="email" name="email" placeholder="Email" required autocomplete="username">
      </div>

      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
          <i data-feather="lock" class="h-5 w-5 text-amber-500"></i>
        </div>
        <input class="inp" type="password" name="password" placeholder="Senha" required autocomplete="current-password">
      </div>

      <button class="btn" type="submit">
        <span style="display:inline-flex; align-items:center; gap:8px; justify-content:center;">
          <i data-feather="log-in"></i> Entrar
        </span>
      </button>
    </form>

    {% if error %}
      <div class="mt-5 p-3 rounded-lg" style="background: rgba(239,68,68,.10); color:#fecaca; border:1px solid rgba(239,68,68,.35); font-weight:700; text-align:center;">
        {{ error }}
      </div>
    {% endif %}

    <div class="mt-6 text-center text-xs text-slate-500">
      Não é staff? <a class="text-amber-500 hover:underline" href="{{ url_for('login') }}">Ir para o login normal</a>
    </div>
  </div>

  <script>feather.replace();</script>
</body>
</html>
