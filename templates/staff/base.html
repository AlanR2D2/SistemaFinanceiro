<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Painel Staff{% endblock %}</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/feather-icons"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --staff-bg: #0b1020;
      --staff-panel: #11172e;
      --staff-border: #1f2a4a;
      --staff-accent: #f59e0b;
      --staff-accent-2: #d97706;
      --staff-text: #e5e7eb;
      --staff-muted: #94a3b8;
    }

    body { font-family: 'Inter', sans-serif; background: var(--staff-bg); color: var(--staff-text); }

    .staff-shell { min-height: 100vh; display:flex; flex-direction:column; }
    .staff-topbar{
      background: linear-gradient(90deg, #1a1f3a, #11172e);
      border-bottom: 1px solid var(--staff-border);
      padding: 14px 24px;
      display:flex; align-items:center; justify-content:space-between; gap: 16px;
    }
    .staff-brand{
      display:flex; align-items:center; gap: 10px;
      font-weight:900; font-size: 16px;
    }
    .staff-badge{
      display:inline-flex; align-items:center; gap:6px;
      background: var(--staff-accent); color:#000;
      padding: 3px 10px; border-radius: 999px;
      font-size: 11px; font-weight:900; letter-spacing:.08em;
    }
    .staff-nav{ display:flex; gap: 8px; flex-wrap:wrap; }
    .staff-nav a{
      padding: 8px 12px; border-radius: 10px;
      color: var(--staff-text); font-weight: 700; font-size: 13px;
      border: 1px solid transparent;
      transition: background .15s, border .15s;
    }
    .staff-nav a:hover{ background: rgba(245,158,11,.08); }
    .staff-nav a.active{
      background: rgba(245,158,11,.16);
      border-color: rgba(245,158,11,.45);
      color: #fff;
    }

    .staff-main{ padding: 24px; flex: 1; }
    .staff-card{
      background: var(--staff-panel);
      border: 1px solid var(--staff-border);
      border-radius: 14px;
      overflow:hidden;
    }
    .staff-card-h{
      padding: 16px 20px;
      border-bottom: 1px solid var(--staff-border);
      display:flex; align-items:center; justify-content:space-between; gap: 12px; flex-wrap:wrap;
    }
    .staff-card-title{ font-weight: 900; font-size: 18px; color:#fff; }
    .staff-card-sub{ color: var(--staff-muted); font-size: 12px; margin-top:2px; }

    .btn{
      height:38px; padding: 0 14px; border-radius: 10px;
      border: 1px solid var(--staff-border);
      background: #1c2447; color: #e5e7eb; font-weight: 700; font-size: 13px;
      cursor: pointer;
    }
    .btn:hover{ filter: brightness(1.1); }
    .btn-amber{
      background: var(--staff-accent); color: #000;
      border-color: var(--staff-accent-2);
    }
    .btn-amber:hover{ background: var(--staff-accent-2); color:#000; }
    .btn-danger{
      background: transparent; color:#fca5a5;
      border-color: rgba(239,68,68,.45);
    }
    .btn-danger:hover{ background: rgba(239,68,68,.08); }
    .btn-green{
      background: #16a34a; color: #fff; border-color: #15803d;
    }
    .btn-green:hover{ background: #15803d; }

    table.tbl{ width:100%; border-collapse: collapse; font-size: 13px; }
    table.tbl thead th{
      text-align:left; padding: 12px 16px;
      background: #0f1530; color: #cbd5e1; border-bottom: 1px solid var(--staff-border);
      font-size: 12px; font-weight: 800; white-space:nowrap;
    }
    table.tbl tbody td{
      padding: 12px 16px; border-bottom: 1px solid #1a2244; vertical-align: middle;
    }
    .inp, .sel{
      height: 36px; padding: 0 10px; border-radius: 10px;
      background: #0f1530; color: #fff; border: 1px solid var(--staff-border);
      outline: none;
    }
    .inp:focus, .sel:focus{ border-color: var(--staff-accent); box-shadow: 0 0 0 3px rgba(245,158,11,.18); }

    .pill{
      display:inline-flex; align-items:center; gap:6px;
      padding: 4px 10px; border-radius: 999px;
      font-size: 11px; font-weight: 900;
      border: 1px solid var(--staff-border); background: #0f1530;
    }
    .pill.green{ color:#86efac; border-color: rgba(34,197,94,.35); background: rgba(34,197,94,.10); }
    .pill.red{ color:#fca5a5; border-color: rgba(239,68,68,.35); background: rgba(239,68,68,.10); }
    .pill.amber{ color:#fcd34d; border-color: rgba(245,158,11,.45); background: rgba(245,158,11,.12); }
    .pill.muted{ color:#94a3b8; }

    .alert{
      margin: 12px 0; padding: 12px 14px; border-radius: 12px;
      border: 1px solid rgba(239,68,68,.35); background: rgba(239,68,68,.10); color: #fecaca; font-weight: 700;
    }
    .ok{
      margin: 12px 0; padding: 12px 14px; border-radius: 12px;
      border: 1px solid rgba(34,197,94,.35); background: rgba(34,197,94,.10); color: #bbf7d0; font-weight: 700;
    }

    /* Modal */
    .modal-backdrop{
      position:fixed; inset:0; background: rgba(0,0,0,.6); display:none;
      align-items:center; justify-content:center; z-index: 50; padding: 18px;
    }
    .modal{
      width: 640px; max-width:100%; background: var(--staff-panel);
      border: 1px solid var(--staff-border); border-radius: 14px; overflow:hidden;
    }
    .modal-h{
      padding: 14px 16px; background: #1a1f3a; color:#fff;
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      border-bottom: 1px solid var(--staff-border);
    }
    .modal-b{ padding: 16px; }
    .modal-close{ background:transparent; border:none; color:#fff; font-weight:900; cursor:pointer; font-size:20px; }
    .grid2{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
    @media (max-width: 720px){ .grid2{ grid-template-columns: 1fr; } }
    .field label{ display:block; font-size:12px; color: var(--staff-muted); margin-bottom:6px; font-weight: 800; }
  </style>
</head>
<body>
  <div class="staff-shell">
    <header class="staff-topbar">
      <div style="display:flex; align-items:center; gap: 16px;">
        <div class="staff-brand">
          <i data-feather="shield" style="width:18px; height:18px;"></i>
          <span>Painel Staff</span>
          <span class="staff-badge">STAFF</span>
        </div>

        <nav class="staff-nav">
          <a href="{{ url_for('staff_dashboard') }}" class="{% if request.path == '/staff' %}active{% endif %}">Dashboard</a>
          <a href="{{ url_for('staff_tenants') }}" class="{% if request.path.startswith('/staff/tenants') %}active{% endif %}">Tenants</a>
          <a href="{{ url_for('staff_users') }}" class="{% if request.path.startswith('/staff/users') %}active{% endif %}">Usuários</a>
          <a href="{{ url_for('staff_account') }}" class="{% if request.path.startswith('/staff/account') %}active{% endif %}">Minha conta</a>
        </nav>
      </div>

      <div style="display:flex; align-items:center; gap: 12px;">
        <div style="font-size:12px; color: var(--staff-muted);">
          {{ staff.nome or staff.login or '' }}
        </div>
        <a href="{{ url_for('staff_logout') }}" class="btn">Sair</a>
      </div>
    </header>

    <main class="staff-main">
      {% block content %}{% endblock %}
    </main>
  </div>

  <script>feather.replace();</script>
  {% block scripts %}{% endblock %}
</body>
</html>
